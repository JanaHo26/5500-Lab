name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    outputs:
      # lets auto-fix run only when the tests failed, not when lint failed
      tests_failed: ${{ steps.jest.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # mongodb-memory-server downloads a MongoDB binary; keep it between runs
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Run Jest
        id: jest
        run: |
          set -o pipefail
          npm test -- --ci 2>&1 | tee test-results.log

      - name: Upload Jest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.log
          if-no-files-found: ignore

  auto-fix:
    name: Auto-heal failing tests
    needs: test
    # only after a test failure on a PR, and never on a PR this job opened
    if: >-
      failure() &&
      needs.test.outputs.tests_failed == 'true' &&
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'fix/auto-heal-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Download Jest log
        uses: actions/download-artifact@v4
        with:
          name: test-results

      - name: Ask the AI agent for a patch and verify it
        env:
          # free Google Gemini key (GitHub Models was retired July 30, 2026);
          # AI_MODEL / AI_ENDPOINT repo variables can switch to another
          # OpenAI-compatible provider without code changes
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: npx ts-node --transpile-only scripts/auto-heal.ts

      - name: Commit the patch to a new branch and open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: fix/auto-heal-${{ github.run_id }}
          TARGET: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src
          git commit -m "fix: auto-heal failing tests from #$PR_NUMBER" \
            -m "Patch generated by the auto-fix CI job (run ${{ github.run_id }}) and verified by re-running Jest."
          git push origin "$BRANCH"
          gh pr create \
            --base "$TARGET" \
            --head "$BRANCH" \
            --title "Auto-heal: fix failing tests from #$PR_NUMBER" \
            --body-file fix-summary.md
